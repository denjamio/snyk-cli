version: 2

project_name: snyk-cli

builds:
  - id: snyk-cli
    main: ./cmd/snyk
    binary: snyk
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/denjamio/snyk-cli/internal/cli.Version={{ .Version }}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: denjamio
    name: snyk-cli
  draft: true
  header: |
    ## snyk-cli {{ .Tag }}

    Read-only CLI over the Snyk REST Issues API with deterministic JSON output.

    Verify checksums: `sha256sum --check checksums.txt`
